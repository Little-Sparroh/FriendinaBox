[config]
schemaVersion = "0.0.1"

[package]
namespace = "Sparroh"
name = "FriendinaBox"
description = "Friend in a Box — deployable proximity-mine grenade that enables multiplayer-only Ouroboros upgrades while equipped."
websiteUrl = "https://github.com/Little-Sparroh/FriendinaBox"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack_Mycopunk = "5.4.2403"

[build]
icon = "icon.png"
readme = "README.md"
outdir = "build"

[[build.copy]]
source = "bin/Release/netstandard2.1/FriendinaBox.dll"
target = "BepInEx/plugins/FriendinaBox.dll"

[[build.copy]]
source = "CHANGELOG.md"
target = "CHANGELOG.md"

[[build.copy]]
source = "LICENSE"
target = "LICENSE"

[publish]
repository = "https://thunderstore.io"
communities = [ "mycopunk" ]

[publish.categories]
mycopunk = [ "mods" ]
